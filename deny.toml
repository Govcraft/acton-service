# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

# Detect known vulnerabilities in dependencies
[advisories]
# Fail on unmaintained crates only if they are direct workspace deps
unmaintained = "workspace"
yanked = "warn"
# Each ignore must include a rationale comment explaining why the advisory is
# accepted. Revisit on every release.
ignore = [
    # No fixed upstream release. `rsa` is used transitively by sqlx-mysql for
    # the MySQL auth handshake, by openidconnect/jsonwebtoken for RSA signature
    # verification, and by surrealdb. None of these paths perform RSA
    # private-key operations on attacker-supplied timing-observable data within
    # acton-service.
    # Tracking: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # rustls-webpki <0.103.x advisories. All four are pulled in via
    # libsql 0.9.30 -> hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.
    # libsql 0.9.30 is the latest published release; remediation requires an
    # upstream libsql release on a newer rustls stack. The vulnerable code
    # paths (X.509 name-constraint enforcement and CRL parsing) are not
    # reachable against the Turso server endpoints we connect to. Re-evaluate
    # when libsql publishes a release built on rustls >=0.23.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27 unbounded empty DATA frame buffering. The directly used h2
    # line is upgraded to 0.4.16; 0.3.27 remains only through optional
    # libsql 0.9.30 -> tonic/hyper. There is no patched 0.3.x release and the
    # latest stable libsql still pins that stack. Turso endpoints are not
    # exposed HTTP/2 servers, limiting this low-severity issue to a malicious
    # or compromised upstream. Re-evaluate with the next stable libsql release.
    "RUSTSEC-2026-0258",
    # rustls 0.22.4 / rustls-webpki 0.102.8 advisories published 2026-10/11:
    # distrusted intermediates accepted (0382), unauthenticated ServerHello
    # downgrading later connections to classical key exchange (0346), and
    # client session secrets in `Debug` output (0349). The 0.23 line used by
    # acton-service is upgraded to the patched 0.23.46. The 0.22 line remains
    # only through optional libsql 0.9.30 -> hyper-rustls 0.25, and libsql
    # 0.10.0 (latest) still pins hyper-rustls 0.25. These affect the Turso
    # client connection only; acton-service never formats libsql's session
    # values. Re-evaluate with the next libsql release on rustls >=0.23.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0382",
    # crypto-bigint 0.5.5 timing variability. After the jsonwebtoken 12
    # upgrade it is reached only via saml-rs 0.5 -> bergshamra 0.9 ->
    # elliptic-curve 0.13, the RustCrypto SAML backend selected on non-Linux
    # targets (Linux x86_64/aarch64 use aws-lc). The fix needs saml-rs 0.8,
    # a breaking upgrade tracked in
    # https://github.com/Govcraft/acton-service/issues/184
    "RUSTSEC-2026-0387",
    # zip 3.0.0 extraction advisories. zip is a build dependency of
    # utoipa-swagger-ui 9.0.2 (latest 9.x), used only to unpack the pinned
    # Swagger UI archive at build time; it is not linked into binaries and
    # handles no runtime input. The fix (utoipa-swagger-ui 10) requires the
    # breaking utoipa 6 upgrade tracked in
    # https://github.com/Govcraft/acton-service/issues/185
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    # chrono is unmaintained (no safe upgrade exists). It is a direct
    # dependency of every workspace crate and its types appear in public APIs
    # (audit events, accounts, tokens), so replacing it is a breaking
    # migration rather than an upgrade. No exploitable defect is reported.
    "RUSTSEC-2026-0543",
]

# Control which licenses are allowed
# Only these permissive licenses are accepted; anything else must be added
# explicitly here or granted a per-crate exception below.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Community Data License Agreement (permissive). Applies to the Mozilla CA
    # root certificate bundles distributed via webpki-roots/webpki-root-certs.
    "CDLA-Permissive-2.0",
    # The Unlicense dedicates the work to the public domain. Used by ext-sort
    # (a transitive dependency of surrealdb-core).
    "Unlicense",
]

# ring uses a composite license (ISC/MIT/OpenSSL) that cargo-deny
# can't automatically classify
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# SurrealDB ships under the Business Source License 1.1. BUSL-1.1 is
# source-available and converts to Apache-2.0 after a four-year change date.
# acton-service consumes SurrealDB as an internal storage dependency rather
# than offering a competing managed database service, which falls within the
# BUSL Additional Use Grant. Approved exception per workspace dependency
# review.
[[licenses.exceptions]]
name = "surrealdb"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-core"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-types"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-types-derive"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-protocol"
allow = ["BUSL-1.1"]

# SDK 3.3 splits the previously approved SurrealDB SDK into these crates.
# Each ships the identical LICENSE as 3.0.5 (SHA-256 begins 98a94ac615f88370).
# Keep this exception scoped to upstream components, not BUSL globally.

[[licenses.exceptions]]
name = "surrealdb-cnf"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-common"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-engine-api"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-iam"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-parse-common"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "surrealdb-rpc"
allow = ["BUSL-1.1"]

# Detect duplicate or banned dependencies
[bans]
multiple-versions = "warn"
wildcards = "allow"

# Control allowed dependency sources
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
