name: Rust validation

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      matrix:
        required: true
        type: string
      exhaustive:
        default: false
        type: boolean
      tooling:
        default: true
        type: boolean
      helpers-tested:
        default: false
        type: boolean
      linux-runner:
        default: ubuntu-latest
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EXPECTED_SHA: ${{ inputs.sha }}
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify revision and selected profiles
        env:
          PROFILE_MATRIX: ${{ inputs.matrix }}
          EXHAUSTIVE: ${{ inputs.exhaustive }}
        run: |
          if [ "$EXHAUSTIVE" = true ]; then
            python scripts/ci/run_profile.py --check-matrix --exhaustive
          else
            python scripts/ci/run_profile.py --check-matrix
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Validate workflows
        if: inputs.tooling
        uses: docker://rhysd/actionlint:1.7.12
      - uses: astral-sh/ruff-action@v4.1.0
        if: inputs.tooling
        with:
          version: '0.16.10'
          src: scripts/ci
      - name: Formatting
        run: cargo fmt --all --check
      - name: CI helper formatting
        if: inputs.tooling
        run: ruff format --check scripts/ci
      - name: Independent reusable-workflow regression checks
        if: '!inputs.helpers-tested'
        run: python -m unittest discover -s scripts/ci/tests -v
      # Main's independent maintenance workflow owns shared cache writes.
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          enableCrossOsArchive: true
          key: ci-v2-registry--${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-v2-registry--
      - name: Fetch any missing locked dependencies
        run: cargo fetch --locked

  profiles:
    needs: format
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.runner == 'windows' && 'windows-latest' || inputs.linux-runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact revision
        run: python -c 'import sys; sys.path.insert(0, "scripts/ci"); import os; from run_profile import verify_revision; verify_revision(os.environ["EXPECTED_SHA"])'
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux' && (matrix.protoc || matrix.kerberos)
        env:
          NEED_PROTOC: ${{ matrix.protoc }}
          NEED_KERBEROS: ${{ matrix.kerberos }}
        run: |
          packages=()
          if [ "$NEED_PROTOC" = true ]; then packages+=(protobuf-compiler); fi
          if [ "$NEED_KERBEROS" = true ]; then packages+=(libkrb5-dev); fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - uses: arduino/setup-protoc@v3
        if: runner.os == 'Windows' && matrix.protoc
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: clippy
      - name: Isolate persistent compiler artifacts by profile
        if: runner.environment == 'self-hosted'
        env:
          PROFILE: ${{ matrix.profile }}
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../.cargo-target-$PROFILE" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: runner.environment != 'self-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          enableCrossOsArchive: true
          key: ci-v2-registry--${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-v2-registry--
      - uses: ./.github/actions/compiler-cache
        id: compiler
        if: runner.environment != 'self-hosted'
        with:
          family: ${{ matrix.cache }}
      - uses: taiki-e/install-action@v2
        if: matrix.tests
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Clippy, tests, and profile checks
        env:
          PROFILE: ${{ matrix.profile }}
        run: python scripts/ci/run_profile.py "$PROFILE"

  validation-gate:
    needs: [format, profiles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require complete Rust validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py rust
