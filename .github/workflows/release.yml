name: Publish acton-service

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed release tag, for example acton-service-v0.45.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-acton-service
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Govcraft/acton-service' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^acton-service-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an acton-service-vMAJOR.MINOR.PATCH release tag.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version and main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          version = manifest['workspace']['package']['version']
          expected = f'acton-service-v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must match workspace version: {expected}')
          print(f'Publishing acton-service {version} from the release tag')
          PY

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify crate packaging
        run: cargo publish --dry-run --locked --registry crates-io -p acton-service

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p acton-service
