name: Publish acton-service

# Trusted publishers for every public workspace crate use owner Govcraft,
# repository acton-service, workflow release.yml, and no GitHub environment.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Signed release tag, for example acton-service-v0.47.0'
        required: true
        type: string
      bootstrap-components:
        description: 'First component release only: use CRATES_IO_BOOTSTRAP_TOKEN for new package names'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-acton-service
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'Govcraft/acton-service' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format before checkout
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^acton-service-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an acton-service-vMAJOR.MINOR.PATCH release tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve and validate the tagged commit
        id: release
        run: python scripts/ci/release.py resolve

  qualify:
    needs: resolve
    uses: ./.github/workflows/qualification.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  bootstrap:
    needs: [resolve, qualify]
    if: inputs.bootstrap-components && needs.qualify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and existing publications before bootstrap
        run: python scripts/ci/release.py preflight
      - name: Bootstrap qualified component packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'First publication requires CRATES_IO_BOOTSTRAP_TOKEN.' >&2
            exit 1
          fi
          python scripts/ci/release.py bootstrap

  publish:
    needs: [resolve, qualify, bootstrap]
    if: >-
      always() && needs.resolve.result == 'success' && needs.qualify.result == 'success' &&
      ((!inputs.bootstrap-components && needs.bootstrap.result == 'skipped') ||
       (inputs.bootstrap-components && needs.bootstrap.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify qualified revision and publication graph
        run: python scripts/ci/release.py preflight
      - name: Authenticate after successful qualification
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish qualified workspace packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python scripts/ci/release.py publish
