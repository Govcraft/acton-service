name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede PR feedback. Main and release runs retain unique groups.
concurrency:
  group: development-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: select validation profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      security: ${{ steps.plan.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test selection and release gates
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Select affected configurations
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUSH_FORCED: ${{ github.event.forced }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/ci/plan.py

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/rust-validation.yml
    with:
      sha: ${{ github.sha }}
      matrix: ${{ needs.changes.outputs.matrix }}
      linux-runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ACTON_LINUX_RUNNER || 'ubuntu-latest' }}

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-validation.yml
    with:
      sha: ${{ github.sha }}

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    uses: ./.github/workflows/security-audit.yml
    with:
      sha: ${{ github.sha }}

  # Keep this name: main branch protection already requires ci-gate.
  ci-gate:
    name: ci-gate
    needs: [changes, rust, docs-build, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py development
