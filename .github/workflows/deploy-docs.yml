name: Deploy validated documentation

on:
  workflow_call:
    inputs:
      run-id:
        description: Successful development run containing the validated site
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The caller checks ci-gate success and overrides intentional ancestor skips.
    # Download its validated artifact even when identical-tree reuse skipped builds.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: site
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
