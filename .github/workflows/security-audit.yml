name: Security Audit

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: python -c 'import sys; sys.path.insert(0, "scripts/ci"); import os; from run_profile import verify_revision; verify_revision(os.environ["EXPECTED_SHA"])'
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
          fallback: none
      - name: Check dependency advisories and policy
        run: |
          cargo audit
          cargo deny --all-features check advisories licenses bans sources
      - name: Generate SBOM
        run: cargo cyclonedx --manifest-path Cargo.toml --format json --all --all-features --target all
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.sha || github.sha }}
          path: '**/*.cdx.json'
          if-no-files-found: error
