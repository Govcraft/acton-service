# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Keep this list in sync with the `advisories.ignore` list in deny.toml. Each
# entry must carry a rationale comment and be revisited every release.

[advisories]
ignore = [
    # rsa Marvin Attack — no fixed upstream release.
    # Used transitively via sqlx-mysql (MySQL auth), openidconnect/jsonwebtoken
    # (RSA signature verification), and surrealdb. No private-key operations
    # against attacker-controlled timing channels in acton-service.
    # Tracking: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # rustls-webpki <0.103.x advisories — pulled in via libsql 0.9.30 ->
    # hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102. libsql 0.9.30
    # is the latest published release; remediation requires an upstream libsql
    # release built on a newer rustls stack.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27 unbounded empty DATA frame buffering. h2 0.4 is updated to the
    # patched 0.4.16; this older line is pinned by optional libsql 0.9.30 via
    # tonic/hyper, with no patched 0.3.x or newer stable libsql available.
    # Turso is a client-only path, so exploitation requires a malicious or
    # compromised upstream. Revisit with the next stable libsql release.
    "RUSTSEC-2026-0258",
    # rkyv 0.7.46 out-of-bounds reads on archives containing Rc/Arc. The fix is
    # in 0.8.17, and 0.7.46 is the newest 0.7.x, so there is nothing to update
    # to on this line. rkyv reaches the lockfile through `rust_decimal`'s
    # optional `rkyv` feature, which nothing here enables: `cargo tree -i rkyv`
    # reports "nothing to print" for every feature and target combination, and
    # cargo-deny's graph-based advisory check passes on the same tree. This is
    # a lockfile entry, not a compiled dependency.
    # Deliberately not mirrored into deny.toml: cargo-deny never flagged this,
    # and an ignore it cannot match is a line nobody can later verify.
    # Revisit when rust_decimal's optional rkyv moves to 0.8.
    "RUSTSEC-2026-0235",
]
