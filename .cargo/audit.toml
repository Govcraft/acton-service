# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Keep this list in sync with the `advisories.ignore` list in deny.toml. Each
# entry must carry a rationale comment and be revisited every release.

[advisories]
ignore = [
    # rsa Marvin Attack — no fixed upstream release.
    # Used transitively via sqlx-mysql (MySQL auth), openidconnect/jsonwebtoken
    # (RSA signature verification), and surrealdb. No private-key operations
    # against attacker-controlled timing channels in acton-service.
    # Tracking: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
    # rustls-webpki <0.103.x advisories — pulled in via libsql 0.9.30 ->
    # hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102. libsql 0.9.30
    # is the latest published release; remediation requires an upstream libsql
    # release built on a newer rustls stack.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27 unbounded empty DATA frame buffering. h2 0.4 is updated to the
    # patched 0.4.16; this older line is pinned by optional libsql 0.9.30 via
    # tonic/hyper, with no patched 0.3.x or newer stable libsql available.
    # Turso is a client-only path, so exploitation requires a malicious or
    # compromised upstream. Revisit with the next stable libsql release.
    "RUSTSEC-2026-0258",
    # rkyv 0.7.46 out-of-bounds reads on archives containing Rc/Arc. The fix is
    # in 0.8.17, and 0.7.46 is the newest 0.7.x, so there is nothing to update
    # to on this line. rkyv reaches the lockfile through `rust_decimal`'s
    # optional `rkyv` feature, which nothing here enables: `cargo tree -i rkyv`
    # reports "nothing to print" for every feature and target combination, and
    # cargo-deny's graph-based advisory check passes on the same tree. This is
    # a lockfile entry, not a compiled dependency.
    # Deliberately not mirrored into deny.toml: cargo-deny never flagged this,
    # and an ignore it cannot match is a line nobody can later verify.
    # Revisit when rust_decimal's optional rkyv moves to 0.8.
    "RUSTSEC-2026-0235",
    # rustls 0.22.4 / rustls-webpki 0.102.8 advisories published 2026-10/11:
    # distrusted intermediates accepted (0382), unauthenticated ServerHello
    # downgrading later connections to classical key exchange (0346), and
    # client session secrets in `Debug` output (0349). The 0.23 line used by
    # acton-service is upgraded to the patched 0.23.46. The 0.22 line remains
    # only through optional libsql 0.9.30 -> hyper-rustls 0.25, and libsql
    # 0.10.0 (latest) still pins hyper-rustls 0.25. These affect the Turso
    # client connection only; acton-service never formats libsql's session
    # values. Re-evaluate with the next libsql release on rustls >=0.23.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0382",
    # crypto-bigint 0.5.5 timing variability. After the jsonwebtoken 12
    # upgrade it is reached only via saml-rs 0.5 -> bergshamra 0.9 ->
    # elliptic-curve 0.13, the RustCrypto SAML backend selected on non-Linux
    # targets (Linux x86_64/aarch64 use aws-lc). The fix needs saml-rs 0.8,
    # a breaking upgrade tracked in
    # https://github.com/Govcraft/acton-service/issues/184
    "RUSTSEC-2026-0387",
    # zip 3.0.0 extraction advisories. zip is a build dependency of
    # utoipa-swagger-ui 9.0.2 (latest 9.x), used only to unpack the pinned
    # Swagger UI archive at build time; it is not linked into binaries and
    # handles no runtime input. The fix (utoipa-swagger-ui 10) requires the
    # breaking utoipa 6 upgrade tracked in
    # https://github.com/Govcraft/acton-service/issues/185
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    # libsqlite3-sys 0.30.1 (bundled C SQLite CVE). A lockfile entry only:
    # `cargo tree -i libsqlite3-sys --all-features --target all` reports
    # "nothing to print", and cargo-deny's graph-based check does not flag it.
    # Deliberately not mirrored into deny.toml, as with RUSTSEC-2026-0235.
    "RUSTSEC-2026-0459",
]
